<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HandUP | Log in</title>
  <link rel="stylesheet" href="login.css" />
</head>

<body>
  <header class="auth-header">
    <div class="container-wide auth-nav">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">HandUP</span>
      </a>
      <a class="btn btn-ghost" href="index.html">Back to Home</a>
    </div>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-label="Log in">
      <h1>Log in</h1>

      <form class="auth-form" id="loginForm" novalidate>
        <label class="field">
          <span>Email</span>
          <input id="email" type="email" placeholder="you@example.com" required autocomplete="email" />
        </label>

        <label class="field">
          <span>Password</span>
          <input id="password" type="password" placeholder="••••••••" required autocomplete="current-password" />
        </label>

        <div class="row">
          <label class="remember">
            <input id="rememberMe" type="checkbox" />
            <span>Remember me</span>
          </label>
          <a class="link" href="#">Forgot password?</a>
        </div>

        <button class="btn btn-primary btn-full" type="submit">
          Log in
        </button>
      </form>

      <div class="divider"><span>or</span></div>

      <div class="social">
        <button id="googleLogin" class="btn btn-social" type="button">
          <span class="icon">G</span> Continue with Google
        </button>
        <button class="btn btn-social" type="button" disabled>
          <span class="icon"></span> Continue with Apple
        </button>
        <button class="btn btn-social" type="button" disabled>
          <span class="icon">f</span> Continue with Facebook
        </button>
      </div>

      <p class="bottom">
        Don’t have an account?
        <a class="link" href="signup.html">Sign up</a>
      </p>
    </section>
  </main>

  <!-- Auth + redirects handled in login.js (calls redirectIfLoggedIn()) -->
  <script type="module" src="./js/login.js"></script>
</body>
</html>
